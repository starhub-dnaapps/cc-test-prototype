<!doctype html>
<!-- Mockup for review (KO-037, p3-05 → p3-06): one prototype page in the v08 design, framed with its label.
     Not a prototype page. It loads the page from ../../../mockups/ in its role's tab name (iframe name = window.name)
     and previews the two v08 markup changes the build will make (the C monogram tile; footer "Version 8"). -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>v08 mockup</title>
<style>
body{margin:0;background:#141414;font:14px/1.4 system-ui,sans-serif}
.mk-label{color:#fff;padding:10px 24px;display:flex;gap:16px;flex-wrap:wrap;align-items:baseline}
.mk-label b{font-size:16px}.mk-label span{color:#d9d9d9}
iframe{display:block;width:100%;border:0;background:#fff}
</style></head>
<body>
<div class="mk-label" id="label"></div>
<script>
var q = new URLSearchParams(location.search), page = q.get("page"), role = q.get("role") || "", theme = q.get("theme") || "light";
try { localStorage.setItem("ccdemo-theme", theme); localStorage.removeItem("nsrcc_prototype-full-v08"); } catch (e) {}
document.getElementById("label").innerHTML = "<b>" + (q.get("t") || page) + "</b><span>" + (q.get("tpl") || "") + "</span><span>Role: " + (q.get("rn") || "launcher") + "</span><span>Mockup · " + theme + " · " + innerWidth + " px · seed v07 data</span>";
var f = document.createElement("iframe");
f.name = role ? "ccdemo-" + role : "";
f.src = "../../../mockups/" + page;
f.onload = function () {
  var d = f.contentDocument;
  d.querySelectorAll(".brand__mark").forEach(function (m) {
    if (m.previousElementSibling && m.previousElementSibling.classList.contains("brand__tile")) return;
    var t = d.createElement("span"); t.className = "brand__tile"; t.setAttribute("aria-hidden", "true"); t.textContent = "C";
    m.parentNode.insertBefore(t, m); m.parentNode.classList.add("brand");
  });
  d.querySelectorAll(".site-footer span").forEach(function (s) { s.textContent = s.textContent.replace("Version 7", "Version 8"); });
  setTimeout(function () { f.style.height = d.documentElement.scrollHeight + "px"; document.title = document.documentElement.scrollHeight; }, 600);
};
document.body.appendChild(f);
</script>
</body></html>
